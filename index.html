<!doctype html>
<html lang="en" data-theme="dark">
<head>

<meta name="description" content="A five-minute probability and decision-making trainer. Expected value, Bayes, poker pot odds and more. Works offline.">
<meta name="theme-color" content="#121211">

<link rel="manifest" href="manifest.webmanifest">

  try { var t = JSON.parse(localStorage.getItem('decision-making.v1') || '{}').theme; if (t === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
